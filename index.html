    <!--
      Runs before first paint, before any CSS/JS loads:
       1. No-flash theme: <html class="dark|light" data-theme-pref="system|light|dark">.
          Must stay in sync with src/components/theme-provider.tsx (key "ambati-theme").
       2. Hero demo pick (SPEC §4.0) so the prerendered page reserves the right height:
          ?demo= wins, else this visit's stored pick, else uniform random via crypto.getRandomValues.
          Mirrors resolveHeroDemo() in src/lab/registry.ts (key "ambati.heroDemo"), which reads it back.
    -->
    <script>
      (function () {
        var r = document.documentElement;
        var t = "system";
        try {
          var s = localStorage.getItem("ambati-theme");
          if (s === "light" || s === "dark" || s === "system") t = s;
        } catch (e) {}
        var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        r.classList.add(dark ? "dark" : "light");
        r.style.colorScheme = dark ? "dark" : "light";
        r.setAttribute("data-theme-pref", t);

        var ids = ["circuit-breaker", "oauth-jwt", "token-bucket"];
        var id = null;
        try {
          var q = new URLSearchParams(location.search).get("demo");
          if (ids.indexOf(q) >= 0) id = q;
          if (!id) {
            var st = sessionStorage.getItem("ambati.heroDemo");
            if (ids.indexOf(st) >= 0) id = st;
          }
          if (!id) {
            var a = new Uint32Array(1);
            crypto.getRandomValues(a);
            id = ids[a[0] % 3];
            sessionStorage.setItem("ambati.heroDemo", id);
          }
        } catch (e) {}
        if (id) r.setAttribute("data-hero-demo", id);
      })();
    </script>
