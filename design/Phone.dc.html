<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — phone, light theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 2600px; overflow: hidden; background: #F2EDE1">
<dc-import name="Main" start-theme="{{startTheme}}" hint-size="390px,2600px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"startTheme":{"editor":"enum","options":["light","dark","system"],"default":"light","section":"Theme"},"$preview":{"width":390,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    return { startTheme: this.props.startTheme ?? 'light' };
  }
}
</script>
</body>
</html>
